<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>fathom — embed test</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #f5f9fa;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
			color: #0E4A55;
		}
		.host {
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		.host_header {
			padding: 12px 20px;
			background: #fff;
			border-bottom: 1px solid #d6e2e6;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.host_header h1 {
			margin: 0;
			font-size: 18px;
			font-weight: 600;
			color: #0E4A55;
		}
		.host_header .hint {
			font-size: 13px;
			color: #6F8488;
		}
		.host_frame {
			flex: 1;
			border: none;
			width: 100%;
		}
	</style>
</head>
<body>
	<div class="host">
		<div class="host_header">
			<h1>fathom — embedded preview</h1>
			<div class="hint">if the iframe is blank, swap the <code>src</code> below for your local URL</div>
		</div>
		<!--
			Default src points at the raw.githack preview of the working branch.
			For local testing, run `python3 -m http.server 8000` from the v1.1
			directory and replace the src below with: http://localhost:8000/
		-->
		<iframe class="host_frame"
			src="https://raw.githack.com/mphealey17/loopy/claude/rewrite-loopy-v1.1-AFuYa/v1.1/index.html">
		</iframe>
	</div>
</body>
</html>
